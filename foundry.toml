[profile.default]
src = "src"
out = "out"
libs = ["lib"]

auto_detect_remappings = false

remappings = [
    "@chainlink/contracts/=lib/chainlink-evm/contracts/",
    "forge-std/=lib/forge-std/src/",
    "foundry-devops/=lib/foundry-devops/"
]

fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
]

ffi=true